<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260">
<style>
  .steam { fill: none; stroke: #FFFFFF; stroke-width: 5; stroke-linecap: round; opacity: 0; animation: rise 3.2s ease-out infinite; }
  .steam.b { animation-delay: 1.05s; } .steam.c { animation-delay: 2.1s; }
  @keyframes rise { 0% { transform: translateY(14px); opacity: 0; } 25% { opacity: .85; } 100% { transform: translateY(-34px); opacity: 0; } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .9s ease-in-out infinite alternate; }
  .flame.b { animation-duration: .7s; animation-delay: .2s; } .flame.c { animation-duration: 1.1s; animation-delay: .4s; }
  @keyframes flick { from { transform: scale(1, 1) skewX(0deg); } to { transform: scale(.88, 1.12) skewX(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .steam { animation: none; opacity: .7; } .flame { animation: none; } }
</style>
